name: ساخت کیبورد کانکی
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: کلید امضا (اگر در Secrets هست)
        env:
          KEYBOARD_KEYSTORE: ${{ secrets.KEYBOARD_KEYSTORE }}
        run: |
          if [ -n "$KEYBOARD_KEYSTORE" ]; then echo "$KEYBOARD_KEYSTORE" | base64 -d > app/kanki-keyboard.jks; fi

      - name: تست‌ها (منطق، Room، چیدمان و عکس کیبورد)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: ساخت APK نهایی (R8، هر پردازنده جدا)
        env:
          KEYBOARD_KEY_PASS: ${{ secrets.KEYBOARD_KEY_PASS }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: سقف اندازه (۱۵ مگابایت)
        run: |
          for f in app/build/outputs/apk/release/*.apk; do
            s=$(stat -c %s "$f"); echo "$f: $s bytes"
            if [ "$s" -gt 15728640 ]; then echo "too large: $f"; exit 1; fi
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kanki-keyboard-apk
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: keyboard-shots
          path: build/shots/*.png

  # تست سرتاسری روی شبیه‌ساز اندروید (گیت‌هاب KVM دارد): نصب، فعال کردن، لمس واقعی کلیدها
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: ساخت نسخه‌ی دیباگ x86_64
        run: ./gradlew --no-daemon -PemulatorAbi :app:assembleDebug
      - name: روشن کردن KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: تست روی شبیه‌ساز
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 scripts/emulator_e2e.py app/build/outputs/apk/debug/app-x86_64-debug.apk emulator-5554
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-screens
          path: build/e2e/*.png
